<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="black-box">
                    <p id="home-score">0</p>
                </div>
                
                <div class="btn-container">
                    <button class="buttons" onclick="plus1Home()">+1</button>
                    <button class="buttons" onclick="plus2Home()">+2</button>
                    <button class="buttons" onclick="plus3Home()">+3</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div class="black-box">
                    <p id="guest-score">0</p>
                </div>
                
                <div class="btn-container">
                    <button class="buttons" onclick="plus1Guest()">+1</button>
                    <button class="buttons" onclick="plus2Guest()">+2</button>
                    <button class="buttons" onclick="plus3Guest()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
